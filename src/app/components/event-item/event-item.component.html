<article class="event-card" [class.is-cancelled]="event.eventCancelled">
    <div class="event-card-header">
        <div class="event-primary">
            <h3>{{ event.name }}</h3>
            <p class="event-datetime">
                {{ getEventDateLabel() }}<ng-container *ngIf="hasEventTime()"> · {{ event.time }} Uhr</ng-container>
            </p>
            <div class="event-meeting-info" *ngIf="hasMeetingInfo()">
                <p *ngIf="hasMeetingTime()">Treffen: {{ event.meetingTime }} Uhr</p>
                <p *ngIf="hasMeetingLocation()">Ort: {{ event.meetingLocation }}</p>
            </div>
        </div>

        <div class="event-header-links">
            <a class="event-secondary-link" [routerLink]="getPiecesRoute()">
                {{ getPiecesLinkLabel() }}
            </a>
            <a *ngIf="isAdmin" class="event-admin-link" [routerLink]="['/event-details', event.documentID]">
                Details
            </a>
        </div>
    </div>

    <div class="event-status-row">
        <span
            class="event-status-pill"
            [ngClass]="getStatusClass()"
            [ngStyle]="getStatusPillStyles()"
        >{{ getStatusLabel() }}</span>
    </div>


    <div class="event-actions" *ngIf="!event.eventCancelled && !usesCustomResponseOptions()" [style.gridTemplateColumns]="'repeat(3, minmax(0, 1fr))'">
        <button class="action-button decline" type="button" [class.active]="containsInCancelled()" [disabled]="containsInCancelled()" (click)="cancel()">
            {{ containsInCancelled() ? 'Abgesagt' : 'Absagen' }}
        </button>
        <button class="action-button maybe" type="button" [class.active]="containsInMaby()" [disabled]="containsInMaby()" (click)="maby()">
            {{ containsInMaby() ? '?' : '?' }}
        </button>
        <button class="action-button promise" type="button" [class.active]="containsInPromise()" [disabled]="containsInPromise()" (click)="promise()">
            {{ containsInPromise() ? 'Zugesagt' : 'Zusagen' }}
        </button>
    </div>

    <div
        class="event-actions"
        [class.custom-response-actions]="!hasOnlyStandardResponseOptions()"
        [class.standard-response-actions]="hasOnlyStandardResponseOptions()"
        *ngIf="!event.eventCancelled && usesCustomResponseOptions()"
    >
        <button
            *ngFor="let option of getResponseOptions()"
            class="action-button custom-option"
            type="button"
            [disabled]="isOptionSelected(option.id)"
            [ngStyle]="getOptionButtonStyles(option)"
            (click)="selectResponseOption(option.id)"
        >
            {{ option.label }}
        </button>
    </div>
</article>
