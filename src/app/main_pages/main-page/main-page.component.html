<section style="margin-bottom: 64px;" class="news-banner" *ngIf="isNewsBannerVisible()">
    <h2>{{ newsBanner.title }}</h2>
    <p>{{ newsBanner.description }}</p>
</section>

<section class="main-page">
    <div class="icon">
        <img src="../../../assets/icon.png" height="248px" width="200px" />
    </div>

    <article style="margin-top: 64px;" class="joke-card" *ngIf="randomJoke.length > 0">
        <i>"{{ randomJoke }}"</i>
    </article>
</section>
